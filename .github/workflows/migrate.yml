name: Migrate all records of an event from v1 to v2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migration in'
        required: true
        type: choice
        default: 'development'
        options:
          - development
          - qa
          - datamigration
      event:
        description: 'The event to process (birth or death)'
        required: true
        type: string
      domain:
        description: 'The environment domain (without protocol or subdomains)'
        required: true
        type: string
        default: 'dev.crvs.gov.to'
      client_id:
        description: 'System Client ID'
        required: false
        type: string
      client_secret:
        description: 'System Client Secret'
        required: false
        type: string
      skip:
        description: 'Number of records to skip'
        required: false
        type: number
        default: 0

jobs:
  fetch-and-transform:
    name: Migrate ${{ github.event.inputs.event }} in ${{ github.event.inputs.environment }} (${{ github.event.inputs.domain }})
    runs-on: [self-hosted, linux, "${{ github.event.inputs.environment }}"]
    environment: ${{ github.event.inputs.environment }}
    outputs:
      script_output: ${{ steps.deno-script.outputs.script_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install dependencies
        run: |
          if ! command -v jq &> /dev/null; then
            echo "jq not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          else
            echo "jq is already installed."
          fi

          if ! command -v deno &> /dev/null; then
            echo "deno not found. Installing..."
            curl -fsSL https://deno.land/install.sh | sh
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          else
            echo "deno is already installed."
          fi

      - name: Convert notebook to TypeScript
        run: |
          mkdir -p tmp
          bash ./scripts/deno-notebook-to-deno.sh ./v1-to-v2-data-migration/migrate.ipynb ./tmp/migrate.ts

      - name: Run the script with Deno
        id: deno-script
        env:
          OPENCRVS_EVENT: ${{ github.event.inputs.event }}
          OPENCRVS_DOMAIN: ${{ github.event.inputs.domain }}
          RECORD_SKIP: ${{ github.event.inputs.skip }}
          OPENCRVS_CLIENT_ID: ${{ github.event.inputs.client_id }}
          OPENCRVS_CLIENT_SECRET: ${{ github.event.inputs.client_secret }}
        run: |
          set +e
          deno run --allow-net --allow-env ./tmp/migrate.ts 2>&1 | tee /tmp/migrate-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          {
            echo "script_output<<MIGRATE_OUTPUT_EOF"
            cat /tmp/migrate-output.txt
            echo "MIGRATE_OUTPUT_EOF"
          } >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Generate summary
        run: |
          echo "## Notebook result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deno-script.outputs.script_output }}" >> $GITHUB_STEP_SUMMARY
